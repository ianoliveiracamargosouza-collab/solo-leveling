name: Import base project

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message != 'Trigger source import'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout original project
        uses: actions/checkout@v4
        with:
          repository: ianoliveiracamargosouza-collab/dragon-ball-multiverse
          ref: main
          path: original
      - name: Copy project files
        run: |
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/import-base.yml' original/ ./
      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import Dragon Ball Multiverse base into Solo Leveling project"
            git push
          fi
