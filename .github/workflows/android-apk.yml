name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Run automated tests
        run: bun run test

      - name: Build web game
        run: bun run build

      - name: Verify prerendered game
        run: |
          test -f .output/public/index.html || {
            echo "Não foi encontrado .output/public/index.html. Verifique a configuração de prerender do TanStack Start."
            find .output -maxdepth 4 -type f -name 'index.html' -print || true
            exit 1
          }

      - name: Install Capacitor tooling
        run: npm install --no-save @capacitor/core @capacitor/android @capacitor/cli

      - name: Create Android project
        run: npx cap add android

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: solo-leveling-shadow-monarch-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
